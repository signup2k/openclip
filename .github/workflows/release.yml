name: Personal Release Packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build personal packages
        run: ./scripts/release_update.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OpenClip-personal-${{ github.sha }}
          path: |
            build/release/*.zip
            build/release/*.dmg
          if-no-files-found: error
